[build]
  command = "rm -rf node_modules package-lock.json && npm install --legacy-peer-deps && npx prisma generate && npx nuxi prepare && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  CI = "true"
  # Exclude Nuxt server bundles from secrets scanning (these use runtime env vars)
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal/**,.nuxt/prerender/**"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma/client", "better-sqlite3"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"