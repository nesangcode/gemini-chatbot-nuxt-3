[build]
  command = "rm -rf node_modules package-lock.json && npm install --legacy-peer-deps && npx nuxi prepare && npm run build && ls -la .output/"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  CI = "true"
  # Exclude Nuxt server bundles from secrets scanning (these use runtime env vars)
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal/**,.nuxt/prerender/**"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"