[build]
  command = "rm -rf node_modules package-lock.json && npm install --legacy-peer-deps && npx nuxi prepare && npm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"
  CI = "true"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"